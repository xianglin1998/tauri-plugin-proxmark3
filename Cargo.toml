[package]
name = "tauri-plugin-proxmark3"
version = "0.2.1"
description = "Proxmark3 client plugin for Tauri v2: run proxmark3 commands and get their output on Android, iOS and desktop"
authors = ["xianglin1998"]
license = "GPL-3.0-or-later"
repository = "https://github.com/xianglin1998/tauri-plugin-proxmark3"
homepage = "https://github.com/xianglin1998/tauri-plugin-proxmark3"
documentation = "https://docs.rs/tauri-plugin-proxmark3"
keywords = ["tauri", "proxmark3", "rfid", "nfc", "plugin"]
categories = ["api-bindings", "development-tools::ffi"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"
links = "pm3bridge"
publish = false

[lib]
name = "tauri_plugin_proxmark3"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tauri = { version = "2", default-features = false, features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
cc = "1"
