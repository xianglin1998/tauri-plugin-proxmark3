name: Smoke app

# Builds examples/minimal-app for every supported platform. The app depends on
# tauri-plugin-proxmark3 through a path dependency, so a green run proves that
# the plugin can be packaged into a real Tauri application on that platform.
#
# Used by ci.yml (on every push) and release.yml (a release is only published
# when every platform compiled).

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  desktop:
    name: App / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            toolchain: stable
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            toolchain: stable
          - name: windows-x86_64-gnu
            os: windows-2022
            target: x86_64-pc-windows-gnu
            toolchain: stable-x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build gcc g++ zlib1g-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja

      - name: Install MSYS2 UCRT64 toolchain (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-lz4
            make
            git

      - name: Expose MinGW-w64 on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "${{ steps.msys2.outputs.msys2-location }}"
          Add-Content -Path $env:GITHUB_PATH -Value "$root\ucrt64\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$root\usr\bin"
          Add-Content -Path $env:GITHUB_ENV  -Value "PM3X_MINGW_BIN=$root\ucrt64\bin"

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --no-self-update
          rustup target add --toolchain "${{ matrix.toolchain }}" "${{ matrix.target }}"
          rustc +"${{ matrix.toolchain }}" -Vv

      - name: Build the minimal app
        shell: bash
        run: |
          # On Windows the GNU toolchain must also be the *host* toolchain:
          # tauri-build embeds an .rc file and picks the resource compiler from
          # the host, and only a GNU host uses windres (an MSVC host would
          # produce a COFF-incompatible resource.lib).
          cargo +"${{ matrix.toolchain }}" build --release \
            --target "${{ matrix.target }}" \
            --manifest-path examples/minimal-app/Cargo.toml

  android:
    name: App / android-arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build make

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Locate the Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n1)"
          fi
          echo "Using NDK: $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Build the minimal app (cdylib for Android)
        run: |
          cd examples/minimal-app
          cargo ndk -t arm64-v8a build --release --lib

  ios:
    name: App / ios-simulator-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          xcodebuild -version

      - name: Build the minimal app (static/cdylib for iOS)
        run: |
          cd examples/minimal-app
          cargo build --release --target aarch64-apple-ios-sim --lib
